[package]
name = "binary-labs-uploader"
version = "0.1.0"
edition = "2024"
publish = false
description = "Sends new files from an instrument PC's folders to a Binary lab, read-only."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
dunce = "1"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
